version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: vdbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdbus_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-vdbus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdbus_secret_password_change_in_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vdbus_admin} -d ${POSTGRES_DB:-vdbus_logistics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vdbus-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_password_change_in_prod}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_password_change_in_prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: vdbus-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vdbus-backend-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-vdbus_logistics};Username=${POSTGRES_USER:-vdbus_admin};Password=${POSTGRES_PASSWORD:-vdbus_secret_password_change_in_prod}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:-redis_secret_password_change_in_prod}"
      Mqtt__Host: "mqtt"
      Mqtt__Port: "1883"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started

  web-admin:
    build:
      context: ..
      dockerfile: web/Dockerfile.admin
    container_name: vdbus-web-admin
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-api

  web-shipper:
    build:
      context: ..
      dockerfile: web/Dockerfile.shipper
    container_name: vdbus-web-shipper
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend-api

volumes:
  postgres_data:
  redis_data:
  mqtt_data:
